# unit4 scheduler stack — docker-compose.unit4-web.yml deploys ONLY the
# dashboard (serops_web.py); this is the missing dispatcher half (tick.sh →
# rotate.sh). Standalone file: the base compose's ser-ops service carries
# unit7-era mounts that do not exist on unit4 (.pgpass, /mnt/xvdbz1).
#
# Deploy: docker compose -f docker-compose.unit4-sched.yml up -d
services:
  ser-ops:
    image: ser.ops:latest
    container_name: ser-ops-sched
    restart: unless-stopped
    init: true
    # unit4: swoopg111 is 1006:1006, docker group is gid 1001 (socket access)
    user: "1006:1006"
    group_add:
      - "1001"
    environment:
      UNIT_NAME: "unit4"
      REPO: /srv/ser.ops
      STATE_DIR: /srv/ser.ops/state
      SLOT_SECONDS: "${SLOT_SECONDS:-1800}"
      TICK_SECONDS: "${TICK_SECONDS:-1800}"
      HOME: /home/swoopg111
    env_file:
      - path: ./deploy/ser_ops.env
        required: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/srv/ser.ops
      # ~/backups on the host is a symlink into the gdrive2 FUSE mount —
      # docker cannot bind-mount a symlink (recreate fails "file exists"),
      # and FUSE writes made every local-fallback/manifest op flaky. Real
      # dir instead; sweep-backups pushes staged files to unit3.
      - /home/swoopg111/backups-data:/home/swoopg111/backups
      - /home/swoopg111/.ssh:/home/swoopg111/.ssh:ro
      - /home/swoopg111/.pgpass:/home/swoopg111/.pgpass:ro
      # backup-configs.sh reads ~/projects ~/server for the "local" unit -
      # without these mounts unit4's own configs were skipped entirely
      # (last successful collection 2026-10-14).
      - /home/swoopg111/projects:/home/swoopg111/projects:ro
      - /home/swoopg111/server:/home/swoopg111/server:ro
    working_dir: /srv/ser.ops
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ser.ops2 — drain instance. Strictly capacity-critical jobs: unit3 -> 5TB
  # offload, local staging sweep, and the 30d log-archive prune. Same image,
  # same state dir (task names don't overlap with ser.ops1's table); it picks
  # up conf/tasks.serops2.conf via UNIT_NAME.
  ser-ops-drain:
    image: ser.ops:latest
    container_name: ser-ops-drain
    restart: unless-stopped
    init: true
    user: "1006:1006"
    group_add:
      - "1001"
    environment:
      UNIT_NAME: "serops2"
      REPO: /srv/ser.ops
      STATE_DIR: /srv/ser.ops/state
      ROTATE_DIR: /srv/ser.ops/state/rotate-serops2
      LANES_DIR: /srv/ser.ops/state/lanes-serops2
      SLOT_SECONDS: "${SLOT_SECONDS:-1800}"
      TICK_SECONDS: "${TICK_SECONDS:-1800}"
      HOME: /home/swoopg111
    env_file:
      - path: ./deploy/ser_ops.env
        required: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/srv/ser.ops
      - /home/swoopg111/backups-data:/home/swoopg111/backups
      - /home/swoopg111/.ssh:/home/swoopg111/.ssh:ro
      - /home/swoopg111/.pgpass:/home/swoopg111/.pgpass:ro
    working_dir: /srv/ser.ops
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ser.ops3 — snapshot lane. Owns fleet-wide vzdump of every prox guest
  # (conf/tasks.serops3.conf) so snapshot runs never contend for the
  # primary or drain lanes.
  ser-ops-snap:
    image: ser.ops:latest
    container_name: ser-ops-snap
    restart: unless-stopped
    init: true
    user: "1006:1006"
    group_add:
      - "1001"
    environment:
      UNIT_NAME: "serops3"
      REPO: /srv/ser.ops
      STATE_DIR: /srv/ser.ops/state
      ROTATE_DIR: /srv/ser.ops/state/rotate-serops3
      LANES_DIR: /srv/ser.ops/state/lanes-serops3
      SLOT_SECONDS: "1800"
      TICK_SECONDS: "1800"
      HOME: /home/swoopg111
    env_file:
      - path: ./deploy/ser_ops.env
        required: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/srv/ser.ops
      - /home/swoopg111/backups-data:/home/swoopg111/backups
      - /home/swoopg111/.ssh:/home/swoopg111/.ssh:ro
      - /home/swoopg111/.pgpass:/home/swoopg111/.pgpass:ro
    working_dir: /srv/ser.ops
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Locator device alerts -> email / Slack / Matrix, polled every minute.
  # Its own long-running service rather than a rotate.sh task: the scheduler
  # ticks every 30 min, far too slow for "this phone is about to die".
  # Script: scripts/locator-alerts.py (stdlib only); state in state/.
  ser-ops-alerts:
    image: ser.ops:latest
    container_name: ser-ops-alerts
    restart: unless-stopped
    init: true
    user: "1006:1006"
    entrypoint: ["python3", "-u", "/srv/ser.ops/scripts/locator-alerts.py"]
    environment:
      STATE_DIR: /srv/ser.ops/state
      LOCATOR_URL: "http://100.123.158.58:50500"
      ALERT_POLL_SECONDS: "60"
    env_file:
      - path: ./deploy/ser_ops.env
        required: false
    volumes:
      - .:/srv/ser.ops
    working_dir: /srv/ser.ops
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
