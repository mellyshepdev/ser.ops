# ser.ops task table for unit7 — name|interval_min|lane|budget_min|lock|command
#
#   interval_min  earliest re-run, measured START-to-START (a slow run never
#                 pushes the next one back).
#   lane          concurrency class. Slots: heavy=1, xfer=1, light=2
#                 (env-overridable LANE_SLOTS_*). One disk-burner and one big
#                 uploader at a time, always — everything else queues per lane,
#                 never behind other lanes.
#   budget_min    HARD ceiling on run time — `timeout -k` kills the task at
#                 budget+60s. Nothing can wedge.
#   lock          bare name under $STATE_DIR/locks shared by tasks that must
#                 serialize; `-` = per-task lock.
#   command       tokens $SCRIPTS, $REPO, $STATE_DIR, $LOCKS_DIR expand at
#                 dispatch time. Keep commands host-agnostic.
#
# Lanes in one line: heavy = local CPU+disk burners (serialized — this is what
# keeps unit7 alive); xfer = outbound-ssh streams to unit3 (bounded network,
# tolerable alongside ONE heavy job); light = small/fast, always dispatchable
# even while heavy work runs.

export|55|light|60|export|$SCRIPTS/export-archive.sh

# Small mounts rotate through 3 shards; >8GB mounts are the "big" task ~daily.
# All volume work shares the `vol` lock (double protection on top of the
# single heavy slot — backup-volumes.sh also self-locks).
vol-0|110|heavy|180|vol|env SHARD=0/3 MAX_MOUNT_MB=8192 KEEP_DAYS=14 $SCRIPTS/backup-volumes.sh
vol-1|110|heavy|180|vol|env SHARD=1/3 MAX_MOUNT_MB=8192 KEEP_DAYS=14 $SCRIPTS/backup-volumes.sh
vol-2|110|heavy|180|vol|env SHARD=2/3 MAX_MOUNT_MB=8192 KEEP_DAYS=14 $SCRIPTS/backup-volumes.sh
vol-big|1320|heavy|300|vol|env MIN_MOUNT_MB=8192 KEEP_DAYS=14 $SCRIPTS/backup-volumes.sh

# Second sink: same mounts into cockroach's userfile store. unit3 tarballs
# remain the primary off-box copy.
voldb|300|heavy|150|voldb|$SCRIPTS/backup-volumes-db.sh

# Local DB dumps, then the same dump logic run ON unit2/unit9 so their
# databases reach unit3 too (ser.ops only runs here; backup-dbs.sh only
# enumerates local containers). 410 vs 350 keeps the two heavy dumps apart.
db|350|heavy|120|dbs|env LOCK=$STATE_DIR/backup-dbs.lock $SCRIPTS/backup-dbs.sh
db-remote|410|heavy|150|dbr|env LOCK=$STATE_DIR/backup-remote.lock $SCRIPTS/backup-remote.sh

# IMAP_INSECURE=1: reech mailbox is reached at unit2's VPC address
# (172.31.3.133:143) — STARTTLS still encrypts, only the name check is
# skipped since no cert can cover a bare IP. Revert when the mail edge is
# repaired and the real hostname works again.
mail|55|light|30|mail|env LOCK=$STATE_DIR/mail.lock IMAP_INSECURE=1 $SCRIPTS/mail-ops.sh

# Daily vaultwarden dump — docker exec pgdb + ssh unit3, both work from the
# ser-ops container (sock + keys are mounted).
vaultwarden|1440|light|30|vault|$SCRIPTS/vaultwarden-backup.sh

# NOTE: backup-configs.sh stays on HOST cron (0 3 * * *) deliberately — it
# walks host $HOME config dirs that are NOT mounted into the ser-ops
# container, so dispatching it here would silently collect nothing.

# Fleet rule: archives live on unit3. One dir per run drains the xvdbz1
# pile without a multi-hour monolith; no-ops once drained.
archive-offload|120|xfer|300|offload|$SCRIPTS/archive-offload.sh
# ~/backups local staging sweep — leftovers after remote failures. Daily.
sweep-backups|1440|xfer|240|sweep|$SCRIPTS/sweep-backups.sh

# live-logger tiered rollover (hot->warm->unit3). 60min drains the 6h hot
# window steadily; loadguard may still defer it into a pile-up.
livlog|60|heavy|90|livlog|$SCRIPTS/livlog-rollover.sh
