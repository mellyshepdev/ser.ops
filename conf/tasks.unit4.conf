# ser.ops task table — unit4
#
# Scoped to what unit4 actually runs: the DB dumps this host was missing,
# the remote fan-out, vaultwarden (container lives here), livlog rollover
# (comms-db lives here), and the staged-backup sweeper.
#
# Deliberately absent vs the default table:
#   export/vol-*/voldb/archive-offload — depend on /mnt/xvdbz1 volume-archive,
#     a unit7 mount that doesn't exist on this box.
#   mail — mail-ops creds/deploy conf were unit7-side; re-add if it moves here.
#
# Format: name|interval_min|lane|budget_min|lock|command
db|350|heavy|120|dbs|env LOCK=$STATE_DIR/backup-dbs.lock $SCRIPTS/backup-dbs.sh
db-remote|410|heavy|150|dbr|env LOCK=$STATE_DIR/backup-remote.lock $SCRIPTS/backup-remote.sh
vaultwarden|1440|light|30|vault|$SCRIPTS/vaultwarden-backup.sh
livlog|60|heavy|90|livlog|$SCRIPTS/livlog-rollover.sh
sweep-backups|1440|xfer|240|sweep|$SCRIPTS/sweep-backups.sh
mail|10|light|30|mail|env LOCK=$STATE_DIR/mail.lock IMAP_INSECURE=1 UNIT_NAME=unit4 $SCRIPTS/mail-ops.sh
mailstore|1440|light|30|mailstore|env LOCK=$STATE_DIR/mailstore.lock $SCRIPTS/backup-mailstore.sh
