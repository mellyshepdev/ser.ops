# ser.ops task table — DEFAULT template, used when conf/tasks.<UNIT>.conf
# does not exist for this host.
#
# ser.ops is portable infrastructure: deploy the repo anywhere, set UNIT_NAME,
# write a tasks.<unit>.conf describing THAT host's work, and run
# deploy/tick.sh. This file is the safe generic fallback — copy it to
# tasks.<your-unit>.conf and edit.
#
# Format: name|interval_min|lane|budget_min|lock|command
#   lane   heavy(1 slot)|xfer(1)|light(2) — env LANE_SLOTS_HEAVY/XFER/LIGHT
#   lock   shared name under $STATE_DIR/locks, or `-` for per-task
#   command  tokens $SCRIPTS $REPO $STATE_DIR $LOCKS_DIR expand at dispatch

export|55|light|60|export|$SCRIPTS/export-archive.sh
vol-0|110|heavy|180|vol|env SHARD=0/3 MAX_MOUNT_MB=8192 KEEP_DAYS=14 $SCRIPTS/backup-volumes.sh
vol-1|110|heavy|180|vol|env SHARD=1/3 MAX_MOUNT_MB=8192 KEEP_DAYS=14 $SCRIPTS/backup-volumes.sh
vol-2|110|heavy|180|vol|env SHARD=2/3 MAX_MOUNT_MB=8192 KEEP_DAYS=14 $SCRIPTS/backup-volumes.sh
vol-big|1320|heavy|300|vol|env MIN_MOUNT_MB=8192 KEEP_DAYS=14 $SCRIPTS/backup-volumes.sh
voldb|300|heavy|150|voldb|$SCRIPTS/backup-volumes-db.sh
db|350|heavy|120|dbs|env LOCK=$STATE_DIR/backup-dbs.lock $SCRIPTS/backup-dbs.sh
db-remote|410|heavy|150|dbr|env LOCK=$STATE_DIR/backup-remote.lock $SCRIPTS/backup-remote.sh
mail|55|light|30|mail|env LOCK=$STATE_DIR/mail.lock IMAP_INSECURE=1 $SCRIPTS/mail-ops.sh
vaultwarden|1440|light|30|vault|$SCRIPTS/vaultwarden-backup.sh
archive-offload|120|xfer|300|offload|$SCRIPTS/archive-offload.sh
sweep-backups|1440|xfer|240|sweep|$SCRIPTS/sweep-backups.sh
livlog|60|heavy|90|livlog|$SCRIPTS/livlog-rollover.sh
