# ser.ops2 — drain instance. Strictly capacity-critical jobs: drains unit3 to
# the 5TB Drive, sweeps local staging up to unit3, and bounds the log archive
# on unit10. Everything else stays on ser.ops1's usual schedule (UNIT_NAME
# picks this table via conf/tasks.$UNIT_NAME.conf).
#
# Format: name|interval_min|lane|budget_min|lock|command
gdrive-offload|180|xfer|240|gdriveoff|env ARCHIVE_AGE=7d $SCRIPTS/gdrive-offload.sh
sweep-backups|720|xfer|240|sweep|$SCRIPTS/sweep-backups.sh
archive-prune|360|light|30|prune|env ARCH_HOST=100.124.192.55 LOCK=$STATE_DIR/archive-prune.lock $SCRIPTS/archive-prune.sh
