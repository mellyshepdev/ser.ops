# ser.ops mail rules — first match wins, anything unmatched is kept.
# Actions (comma-set): keep (default), trash, alert (owner notify via
# matrix-relay MAIL ALERT -> email), forward (remail verbatim to sales@ —
# the record/poller mailbox on unit2's docker-mailserver).
#
# Order matters: house-keep first, transaction subjects second (they get
# forward+alert), provider catch-alls third (forward-only record), generic
# security/activity alerts fourth, junk last.

# ── Mailbox-wide routing (account: = mailbox name from mail-accounts.conf) ──
# partnerships@tikurbego.com — owner wants every new inbox arrival alerted.
account:journal|alert
account:partnerships|alert

# ── Always keep ───────────────────────────────────────────────────────
from:@theofficialblacksheepco.com|keep
from:@puff-base.com|keep

# ── Money movement: transactions, bills, orders → forward + alert ─────
subject:made the sale|forward,alert
subject:sold|forward,alert
subject:order|forward,alert
subject:Order|forward,alert
subject:payment|forward,alert
subject:Payment|forward,alert
subject:receipt|forward,alert
subject:Receipt|forward,alert
subject:payout|forward,alert
subject:Payout|forward,alert
subject:funds|forward,alert
subject:invoice|forward,alert
subject:Invoice|forward,alert
subject:bill|forward,alert
subject:Bill|forward,alert
subject:transaction|forward,alert
subject:Transaction|forward,alert
subject:activity|forward,alert
subject:Activity|forward,alert
subject:refund|forward,alert
subject:charge|forward,alert
subject:shipping|forward,alert
subject:Shipping|forward,alert

# ── Account/security activity — forward for the record AND alert ──────
# (must precede the provider catch-alls or these subjects lose the alert)
subject:security alert|forward,alert
subject:Security Alert|forward,alert
subject:sign-in|forward,alert
subject:Sign-in|forward,alert
subject:password|forward,alert
subject:Password|forward,alert
subject:suspicious|forward,alert
subject:verify your|forward,alert

# ── Providers — forward everything into the record box ────────────────
# `.domain.tld` catches every subdomain (e.ebay.com, mail.ionos.com, ...)
from:@ebay.com|forward
from:.ebay.com|forward
from:@ionos.com|forward
from:.ionos.com|forward
from:@amazon.com|forward
from:.amazon.com|forward
from:@amazonaws.com|forward
from:.amazonaws.com|forward
from:@aws.amazon.com|forward
from:@google.com|forward
from:.google.com|forward
from:@googlemail.com|forward
from:@microsoft.com|forward
from:.microsoft.com|forward
from:@azure.com|forward
from:.azure.com|forward
from:@paypal.com|forward
from:.paypal.com|forward
from:@stripe.com|forward
from:.stripe.com|forward

# ── Junk ──────────────────────────────────────────────────────────────
from:@linkedin.com|trash
from:@e.linkedin.com|trash
from:@facebookmail.com|trash
from:@twitter.com|trash
from:@x.com|trash
subject:Unsubscribe|trash
subject:% off|trash
subject:Flash Sale|trash
subject:SALE|trash
subject:newsletter|trash
